<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<style type="text/css">
.container{
   margin-top: 50px;
}
.row {
  margin: 0px auto;
  width: 350px;
}
h3 {
  text-align: center;
}
</style>
</head>
<body>
	<div class="container">
		<div class="row">
			<h3>삭제하기</h3>
			<form action="/board/delete_ok" method="post">
				<table class="table">
					<tr>
						<td class="text-center">
							비밀번호 : <input type="password" size="15" name="pwd" class="" required>
							<input type="hidden" th:value="${no}" name="no">
						</td>
					</tr>
					<tr>
						<td class="text-center">
							<button type="submit" class="btn-sm btn-primary">삭제</button>						
							<button type="button" class="btn-sm btn-primary" onclick="javascript:history.back()">취소</button>						
						</td>
					</tr>
				</table>
			</form>
		</div>
	</div>
</body>
</html>
