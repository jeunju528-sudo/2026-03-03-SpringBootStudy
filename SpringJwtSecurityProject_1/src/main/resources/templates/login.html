<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<style type="text/css">
.container {
	margin-top: 50px;
}

.row {
	width: 350px;
	margin: 0px auto;
}
</style>
</head>
<body>
	<div class="container">
		<div class="row">
			<h3 class="text-center">로그인</h3>
			<form action="/login" method="post">
				<table class="table">
					<tbody>
						<tr>
							<td width="20%">ID</td>
							<td width="80%">
								<input type="text" name="username" class="input-sm" size="20">
							</td>
						</tr>
						<tr>
							<td width="20%">PWD</td>
							<td width="80%">
								<input type="password" name="password" class="input-sm" size="20">
							</td>
						</tr>
						<tr>
							<td colspan="2">
								<button type="submit" class="btn btn-sm btn-warning">로그인</button>
								<button type="button" class="btn btn-sm btn-info" onclick="javascript:history.back()">취소</button>
							</td>
						</tr>
					</tbody>
				</table>
			</form>
		</div>
	</div>
</body>
</html>
