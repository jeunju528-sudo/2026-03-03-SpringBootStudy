<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<style type="text/css">
.container {
	margin-top: 50px;
}
.row {
	margin: 0px auto;
	width: 600px;
}
.h3 {
	text-align: center;
}
</style>
<script type="text/javascript" src="http://code.jquery.com/jquery.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script type="text/javascript">
let stompClient = null
function connection(){
	// 여기가 http 헤더에 websocket으로 통신하겠다는 요청을 보내주는 부분
	const socket = new SockJS('/ws-chat')
	stompClient = Stomp.over(socket)
	
	stompClient.connect({},function(msg){
		// 어느 url 주소에서 값을 받을건지 = 채널
		// 서버에서 값을 받는 거니까 /topic prefix 붙여줘야함
		// 저 게시판의 글을 읽겠다고 구독하는 것!!
		stompClient.subscribe('/topic/public', function(msg){ 
			const data = JSON.parse(msg.body)
			console.log(msg)
			console.log(msg.body)
			showMessage(data)
		}) 
		
	})
}

function sendMessage(){
	// 클라이언트가 서버로 보내는거니까 /app prefix 붙여줘야함
	stompClient.send('/app/chat.send',{},JSON.stringify({
		sender:$('#sender').val(),
		message:$('#message').val()
	}))
	
}

// 서버에서 전송된 값 처리
function showMessage(data){
	$('#chat').append(
		'<li>['+data.sender+']'+data.message+'('+data.time+')</li>'		
	)
}

$(function(){
	connection()
})
</script>
</head>
<body>
	<div class="container">
		<div class="row">
			<h3>간단한 WebSocket 채팅</h3>
			<table class="table">
				<tbody>
					<tr>
						<th width="15%" class="text-center">이름</th>
						<td width="85%">
							<input type="text" id="sender" size="20" class="input-sm">
						</td>
					</tr>
					<tr>
						<th width="15%" class="text-center">메세지</th>
						<td width="85%">
							<input type="text" id="message" size="50" class="input-sm">
						</td> 
					</tr>
					<tr>
						<td colspan="2" class="text-center">
							<button class="btn btn-sm btn-primary" onclick="sendMessage()">전송</button>
						</td>
					</tr>
					<tr>
						<td colspan="2">
							<ul id="chat">
								
							</ul>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
	
</body>
</html>
